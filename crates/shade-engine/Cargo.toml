[package]
name = "shade-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test-only SIGSTOP rendezvous. Never enabled in the distribution binary.
fault-injection = []
# Exposes deterministic fakes for integration tests. Never enabled in the distribution binary.
test-support = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
dirs.workspace = true
hex.workspace = true
json5.workspace = true
libc.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
shade-protocol = { path = "../shade-protocol" }
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ulid.workspace = true
url.workspace = true
walkdir.workspace = true

[dev-dependencies]
# Self-dependency so the crate's own integration tests (compiled as external
# crates) see the `test-support` fakes without a command-line `--features`.
shade-engine = { path = ".", features = ["test-support"] }
# Integration tests reach the database file directly to plant the rows an
# older binary would have written; the engine deliberately exposes no writer
# for a state it never produces.
rusqlite.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
