[workspace]
members = [
  "crates/shade-protocol",
  "crates/shade-engine",
  "crates/shade-client",
  "crates/shade-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
hex = "0.4"
json5 = "1.3.1"
libc = "0.2"
regex = "1.12"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
toml = "1.1.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = { version = "1.2", features = ["serde"] }
url = "2.5"
walkdir = "2.5"

[profile.release]
lto = "thin"
strip = true
